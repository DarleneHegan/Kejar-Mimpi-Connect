<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Peserta - Kejar Mimpi Jakarta Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">

  <div class="flex h-screen overflow-hidden">
    <aside id="admin-sidebar-slot" class="hidden md:block w-64 bg-white border-r border-gray-100 flex-shrink-0"></aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="md:hidden bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between">
        <span class="font-bold text-gray-800">Kejar Mimpi Jakarta <span class="text-[#C8102E]">Admin</span></span>
        <button id="admin-mobile-menu-btn" class="p-2 text-gray-600">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
      </header>

      <main class="flex-1 overflow-y-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="admin-hero">
          <div class="admin-hero-glow"></div>
          <div class="relative">
            <p class="admin-hero-eyebrow">Rekap Data</p>
            <h1 class="text-2xl font-extrabold">Laporan Peserta</h1>
            <p class="text-sm text-white/80 mt-1 max-w-xl">Lihat daftar pendaftar dan status kehadiran per event, lalu export ke CSV.</p>
          </div>
          <div class="relative mt-5 max-w-md">
            <label for="event-select" class="sr-only">Pilih Event</label>
            <select id="event-select" class="admin-hero-select">
              <option value="">-- Memuat daftar event --</option>
            </select>
          </div>
        </div>

        <div id="stats-cards" class="hidden grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6"></div>

        <div id="no-event-state" class="flex flex-col items-center justify-center admin-empty">
          <div class="admin-icon-badge w-14 h-14 bg-red-50 text-[#C8102E] mb-3">
            <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" /></svg>
          </div>
          <p class="text-gray-600 font-semibold">Pilih event terlebih dahulu</p>
          <p class="text-gray-400 text-sm mt-1">Laporan pendaftar dan kehadiran akan muncul di sini</p>
        </div>

        <div id="report-table-wrap" class="hidden admin-card overflow-hidden">
          <div class="flex flex-col sm:flex-row sm:items-center gap-3 px-5 py-4 border-b border-gray-100">
            <span id="result-count" class="text-xs font-medium text-gray-400"></span>
            <div class="relative sm:ml-auto sm:w-72">
              <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z" /></svg>
              <label for="search-input" class="sr-only">Cari peserta</label>
              <input type="text" id="search-input" placeholder="Cari nama atau email..." class="admin-search" />
            </div>
            <button id="export-csv-btn" class="admin-btn-ghost text-sm flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
              Export CSV
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm admin-table">
              <thead>
                <tr>
                  <th class="text-left px-5 py-3 font-semibold">Nama</th>
                  <th class="text-left px-5 py-3 font-semibold">Email</th>
                  <th class="text-left px-5 py-3 font-semibold">No. HP</th>
                  <th class="text-left px-5 py-3 font-semibold">Waktu Daftar</th>
                  <th class="text-left px-5 py-3 font-semibold">Status</th>
                  <th class="text-left px-5 py-3 font-semibold">Waktu Check-in</th>
                </tr>
              </thead>
              <tbody id="report-table-body" class="divide-y divide-gray-100"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/pages/admin-reports.js"></script>
</body>
</html>
