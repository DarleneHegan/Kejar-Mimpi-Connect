<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin - Kejar Mimpi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-gradient-to-br from-[#C8102E] to-[#8a0b20] min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-xl bg-white flex items-center justify-center mx-auto mb-4 overflow-hidden">
        <img src="/images/logo-kejar-mimpi.jpg" alt="Kejar Mimpi" class="w-full h-full object-cover" />
      </div>
      <h1 class="text-white font-bold text-2xl">Kejar Mimpi Admin</h1>
      <p class="text-red-100 text-sm mt-1">Kelola event dan absensi komunitas</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h2 class="font-bold text-gray-800 text-lg mb-6">Masuk ke Panel Admin</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email" required
            class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#C8102E]/40 focus:border-[#C8102E]" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="password" required
            class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#C8102E]/40 focus:border-[#C8102E]" />
        </div>
        <div id="error-box" class="hidden bg-red-50 text-red-600 text-sm rounded-lg px-4 py-2.5"></div>
        <button type="submit" id="submit-btn"
          class="w-full bg-[#C8102E] hover:bg-[#a10d25] text-white font-semibold py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
          <span id="submit-btn-text">Masuk</span>
          <div id="submit-spinner" class="hidden spinner !w-4 !h-4 !border-2 !border-white !border-t-transparent"></div>
        </button>
      </form>
    </div>

    <a href="/index.html" class="block text-center text-red-100 text-sm mt-6 hover:text-white">&larr; Kembali ke halaman publik</a>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    // Jika sudah login, langsung redirect ke dashboard
    if (isAdminLoggedIn()) {
      window.location.href = "/admin/dashboard.html";
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("error-box");
      const submitBtn = document.getElementById("submit-btn");
      const submitBtnText = document.getElementById("submit-btn-text");
      const submitSpinner = document.getElementById("submit-spinner");

      errorBox.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtnText.textContent = "Memproses...";
      submitSpinner.classList.remove("hidden");

      try {
        const result = await loginAdmin(email, password);
        setAdminSession(result.access_token, result.admin_name);
        window.location.href = "/admin/dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Login gagal";
        errorBox.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtnText.textContent = "Masuk";
        submitSpinner.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
